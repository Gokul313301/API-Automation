# ---------------------------------------------------------------
# Environment configuration. Read at runtime by ConfigManager.
# Keeping values here (not hard-coded in tests) means you can point
# the whole suite at a different environment by changing one line.
# ---------------------------------------------------------------

# Base URL of the API under test.
# JSONPlaceholder is a free fake REST API - great for learning, no auth needed.
base.url=https://jsonplaceholder.typicode.com

# Default timeouts (milliseconds)
timeout.connection=10000
timeout.socket=15000

# Logging switch (learning aid):
#   true  = print the FULL request AND response (headers + JSON body) for every call
#   false = stay quiet, and only dump request/response when an assertion FAILS
# Flip this to false once the request/response flow feels familiar.
log.all=true
